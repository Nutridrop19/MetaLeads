<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Leads Sorter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box}
:root{--bg:#eeeae2;--ink:#171717;--muted:#77736c;--paper:#fdfcf9;--line:#d9d4ca;--orange:#ff5a36;--lime:#c9f15a;--black:#171717}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);padding:28px;font-family:'DM Sans',sans-serif}
.container{max-width:1240px;margin:auto}
.header{min-height:210px;position:relative;overflow:hidden;background:var(--black);color:#fff;padding:30px 34px;border-radius:28px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:8px 8px 0 #c9c3b8}
.header:before{content:'LEAD MANAGEMENT / 01';position:absolute;left:34px;top:28px;font:600 11px 'Space Grotesk',sans-serif;letter-spacing:2px;color:#aaa69d}
.header:after{content:'';position:absolute;right:-40px;top:-75px;width:270px;height:270px;border:70px solid var(--orange);border-radius:50%;box-shadow:-90px 120px 0 -35px var(--lime)}
.header h2{margin:0 0 7px;font:700 clamp(34px,5vw,58px)/.95 'Space Grotesk',sans-serif;letter-spacing:-2.5px;position:relative;z-index:1}
.header p{margin:0;color:#c7c4bd;font-size:14px;position:relative;z-index:1}
.stat{display:flex;align-items:center;gap:13px;width:max-content;margin:27px 0 18px;padding:9px 12px 9px 9px;background:var(--paper);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:#5e5a53;box-shadow:4px 4px 0 #d0c9bd}
.stat:before{content:'';width:32px;height:32px;border-radius:50%;background:var(--lime);box-shadow:inset 0 0 0 1px #b6dc43}
.num{font:700 20px 'Space Grotesk',sans-serif;color:var(--ink);margin-left:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;margin:0 0 22px;box-shadow:5px 5px 0 #d0c9bd}
textarea{display:block;width:100%;height:235px;resize:vertical;padding:20px;border:1.5px dashed #bbb5aa;border-radius:17px;background:#f5f2eb;color:var(--ink);outline:none;font:500 14px/1.7 'DM Sans',sans-serif;transition:.2s ease}
textarea::placeholder{color:#9b968c}
textarea:focus{border-style:solid;border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(255,90,54,.09)}
button{padding:14px 23px;border:0;border-radius:12px;background:var(--orange);color:#fff;cursor:pointer;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.7px;box-shadow:4px 4px 0 #c63d20;transition:.15s ease}
button:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #c63d20}
button:active{transform:translate(4px,4px);box-shadow:none}
.tablewrap{overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:5px 5px 0 #d0c9bd}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--black);color:#fff;padding:16px 18px;text-align:left;font:700 10px 'Space Grotesk',sans-serif;letter-spacing:1.3px}
td{padding:16px 18px;border-bottom:1px solid #e8e3da;color:#403d38}
tbody tr:nth-child(even){background:#faf8f3}
tbody tr:hover{background:#f1eddf}
tbody tr:last-child td{border-bottom:0}
@media(max-width:700px){body{padding:15px}.header{min-height:190px;padding:25px 22px;border-radius:21px}.header:before{left:22px;top:22px}.header:after{right:-100px}.header h2{font-size:39px}.card{padding:15px;border-radius:19px}.stat{margin-top:22px}textarea{height:210px} .tablewrap{overflow-x:auto}table{min-width:650px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h2>Meta Leads Sorter</h2><p>Paste leads mentah lalu proses.</p></div>

<div class="stat">Total Leads: <span class="num" id="totalLeads">0</span></div>

<div class="card">
<textarea id="rawData" placeholder="Paste data Meta di sini"></textarea><br><br>
<button onclick="prosesLead()">PROSES LEADS</button>
</div>

<div class="tablewrap">
<table>
<thead>
<tr><th>NAMA</th><th>TELPON / WHATSAPP</th><th>CAMPAIGN / PRODI</th></tr>
</thead>
<tbody id="leadTable"></tbody>
</table>
</div>
</div>

<script>
const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbwWCyuO-LZxg-9DN3dDJfsbehVppyRK3CADWjxzKJwAPO58vzWdBj6c-pL451usISU/exec";
let total=0;
const nomorTersimpan=new Set();


function formatNomor(nomor){
  nomor=nomor.replace(/\D/g,"");
  if(nomor.startsWith("0")) nomor="62"+nomor.substring(1);
  else if(nomor.startsWith("8")) nomor="62"+nomor;
  return nomor;
}

async function prosesLead(){
const raw=document.getElementById("rawData").value.trim();
if(!raw){alert("Paste data dulu");return;}
const blocks =
raw.split(/Pilih Prodi.*?yang kamu minati/i);

for(const block of blocks){
if(!block.trim()) continue;

const lines=block.split("\n").map(v=>v.trim()).filter(v=>v);

let nama="", prodi=lines[0]||"", wa1="", wa2="";

for(let i=0;i<lines.length;i++){
if(lines[i]==="Nama") nama=lines[i+1]||"";
if(lines[i]==="Nomor Whatsapp Aktif") wa1=formatNomor(lines[i+1]||"");
if(lines[i]==="Phone number") wa2=formatNomor(lines[i+1]||"");
}

let waGabungan="";
if(wa1&&wa2){
waGabungan=(wa1!==wa2)?wa1+" / "+wa2:wa1;
}else{
waGabungan=wa1||wa2;
}

const nomorUtama=wa1||wa2;
if(!nomorUtama || nomorTersimpan.has(nomorUtama)) continue;

nomorTersimpan.add(nomorUtama);

document.getElementById("leadTable").insertAdjacentHTML("beforeend",
`<tr><td>${nama}</td><td>${waGabungan}</td><td>${prodi}</td></tr>`);

try{
const form = new URLSearchParams();

form.append("nama", nama);
form.append("wa", waGabungan);
form.append("prodi", prodi);

await fetch(WEBAPP_URL,{
    method:"POST",
    mode:"no-cors",
    body:form
});
}catch(e){console.error(e);}

total++;
}

document.getElementById("totalLeads").innerText=total;
document.getElementById("rawData").value="";
}
</script>
</body>
</html>
